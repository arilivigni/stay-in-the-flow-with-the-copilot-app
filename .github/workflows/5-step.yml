name: Step 5

on:
  workflow_dispatch:
  issue_comment:
    types: [created, edited]
  issues:
    types: [labeled, unlabeled]

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: step-5-${{ github.repository }}
  cancel-in-progress: false

env:
  STEP_MARKER: "step-5-approval"

jobs:
  find_exercise:
    name: Find Exercise Issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3
    with:
      issue-title-text: "Exercise: Build your daily triage assistant"

  check_step_work:
    name: Check step work
    needs: [find_exercise]
    if: startsWith(github.event.issue.title, 'Seed:')
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.grade.outputs.passed }}
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
      SEED_ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Find learner's marked approval comment
        id: learner
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.SEED_ISSUE_NUMBER }}
          body-includes: "<!-- step-5-approval:start -->"
          direction: last

      - name: Read seeded issue body and labels
        id: seed
        if: steps.learner.outputs.comment-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$ISSUE_REPOSITORY/issues/$SEED_ISSUE_NUMBER" --jq .body > "${{ runner.temp }}/issue.md"
          labels=$(gh api "repos/$ISSUE_REPOSITORY/issues/$SEED_ISSUE_NUMBER" --jq '[.labels[].name] | join(" ")')
          echo "labels=$labels" >> "$GITHUB_OUTPUT"

      - name: Find feedback comment
        id: feedback
        if: steps.learner.outputs.comment-id != ''
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: "github-actions[bot]"
          direction: last

      - name: Update comment - checking work
        if: steps.learner.outputs.comment-id != ''
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.feedback.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md

      - name: Save learner comment to a file
        if: steps.learner.outputs.comment-id != ''
        env:
          LEARNER_BODY: ${{ steps.learner.outputs.comment-body }}
        run: printf '%s' "$LEARNER_BODY" > "${{ runner.temp }}/learner.md"

      - name: Grade step work
        id: grade
        if: steps.learner.outputs.comment-id != ''
        uses: ./.github/actions/grade-structured-block
        with:
          step: 5
          body-file: ${{ runner.temp }}/learner.md
          labels: ${{ steps.seed.outputs.labels }}
          issue-body-file: ${{ runner.temp }}/issue.md

      - name: Update comment - step results
        if: steps.learner.outputs.comment-id != ''
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.feedback.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 5
            results_table:
              - description: "${{ steps.grade.outputs.message }}"
                passed: ${{ steps.grade.outputs.passed == 'true' }}

      - name: Fail job if the step did not pass
        if: steps.learner.outputs.comment-id != '' && steps.grade.outputs.passed != 'true'
        run: exit 1

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 6

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/steps/6-step.md

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{ github.workflow }}"
          gh workflow enable "Step 6"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
