name: Step 1
on:
  issue_comment:
    types: [created, edited]
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: step-1-${{ github.repository }}
  cancel-in-progress: false
jobs:
  find_exercise:
    name: Find Exercise Issue
    runs-on: ubuntu-latest
    outputs:
      issue-number: ${{ steps.find.outputs.number }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo '${{ github.repository }}' --state open --search '"Exercise: Build your daily triage assistant" in:title' --json number,title --jq '.[] | select(.title == "Exercise: Build your daily triage assistant") | .number' | head -1)
          echo "number=$number" >> "$GITHUB_OUTPUT"
  check_step_work:
    name: Check step work
    needs: [find_exercise]
    if: ${{ github.event.issue.number == fromJSON(needs.find_exercise.outputs.issue-number) }}
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.grade.outputs.passed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh issue view '${{ needs.find_exercise.outputs.issue-number }}' --repo '${{ github.repository }}' --json labels --jq '[.labels[].name] | contains(["step-1"])')
          echo "active=$active" >> "$GITHUB_OUTPUT"
      - id: comment
        if: steps.guard.outputs.active == 'true'
        uses: ./.github/actions/find-marked-comment
        with:
          repository: ${{ github.repository }}
          issue-number: ${{ needs.find_exercise.outputs.issue-number }}
          marker: step-1-context
          output-file: ${{ runner.temp }}/learner.md
      - id: grade
        if: steps.comment.outputs.found == 'true'
        uses: ./.github/actions/grade-structured-block
        with:
          step: 1
          body-file: ${{ runner.temp }}/learner.md
      - if: steps.comment.outputs.found == 'true'
        uses: ./.github/actions/post-feedback
        with:
          repository: ${{ github.repository }}
          issue-number: ${{ needs.find_exercise.outputs.issue-number }}
          step: 1
          message: ${{ steps.grade.outputs.message }}
      - if: steps.comment.outputs.found == 'true' && steps.grade.outputs.passed != 'true'
        run: exit 1
  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Advance once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh issue view '${{ needs.find_exercise.outputs.issue-number }}' --repo '${{ github.repository }}' --json labels --jq '[.labels[].name]')
          jq -e 'contains(["step-1"])' <<<"$labels" >/dev/null || exit 0
          gh issue comment '${{ needs.find_exercise.outputs.issue-number }}' --repo '${{ github.repository }}' --body-file '.github/steps/2-plan.md' >/dev/null
          gh issue edit '${{ needs.find_exercise.outputs.issue-number }}' --repo '${{ github.repository }}' --remove-label 'step-1' --add-label 'step-2' >/dev/null
          gh workflow disable '${{ github.workflow }}'
          gh workflow enable 'Step 2'
