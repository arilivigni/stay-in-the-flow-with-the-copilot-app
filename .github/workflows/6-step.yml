name: Step 6
on:
  issue_comment:
    types: [created, edited]
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: step-6-${{ github.repository }}
  cancel-in-progress: false
jobs:
  find_exercise:
    name: Find Exercise Issue
    runs-on: ubuntu-latest
    outputs:
      issue-number: ${{ steps.find.outputs.number }}
      active: ${{ steps.find.outputs.active }}
    steps:
      - id: find
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          number=$(gh issue list --repo '${{ github.repository }}' --state open --search '"Exercise: Build your daily triage assistant" in:title' --json number,title --jq '.[] | select(.title == "Exercise: Build your daily triage assistant") | .number' | head -1)
          active=$(gh issue view "$number" --repo '${{ github.repository }}' --json labels --jq '[.labels[].name] | contains(["step-6"])')
          echo "number=$number" >> "$GITHUB_OUTPUT"; echo "active=$active" >> "$GITHUB_OUTPUT"
  check_step_work:
    name: Check step work
    needs: [find_exercise]
    if: "${{ needs.find_exercise.outputs.active == 'true' && github.event.issue.title == 'Exercise complete: Daily triage assistant' }}"
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.grade.outputs.passed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: comment
        uses: ./.github/actions/find-marked-comment
        with:
          repository: ${{ github.repository }}
          issue-number: ${{ github.event.issue.number }}
          marker: step-6-summary
          output-file: ${{ runner.temp }}/learner.md
      - if: steps.comment.outputs.found != 'true'
        uses: ./.github/actions/post-feedback
        with:
          repository: ${{ github.repository }}
          issue-number: ${{ github.event.issue.number }}
          step: 6
          message: "Add the `step-6-summary` start and end markers to one comment, then retry."
      - if: steps.comment.outputs.found != 'true'
        run: exit 1
      - id: grade
        if: steps.comment.outputs.found == 'true'
        uses: ./.github/actions/grade-structured-block
        with:
          step: 6
          body-file: ${{ runner.temp }}/learner.md
      - if: steps.comment.outputs.found == 'true'
        uses: ./.github/actions/post-feedback
        with:
          repository: ${{ github.repository }}
          issue-number: ${{ github.event.issue.number }}
          step: 6
          message: ${{ steps.grade.outputs.message }}
      - if: steps.comment.outputs.found == 'true' && steps.grade.outputs.passed != 'true'
        run: exit 1
  post_next_step_content:
    name: Post completion content
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          labels=$(gh issue view '${{ needs.find_exercise.outputs.issue-number }}' --repo '${{ github.repository }}' --json labels --jq '[.labels[].name]')
          jq -e 'contains(["step-6"])' <<<"$labels" >/dev/null || exit 0
          gh issue comment '${{ github.event.issue.number }}' --repo '${{ github.repository }}' --body-file .github/steps/x-review.md >/dev/null
          gh issue edit '${{ github.event.issue.number }}' --repo '${{ github.repository }}' --add-label completed >/dev/null
          gh issue close '${{ github.event.issue.number }}' --repo '${{ github.repository }}' >/dev/null
          gh issue edit '${{ needs.find_exercise.outputs.issue-number }}' --repo '${{ github.repository }}' --remove-label step-6 --add-label completed >/dev/null
          gh workflow disable '${{ github.workflow }}'
