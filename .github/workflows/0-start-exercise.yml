name: Step 0 # Start Exercise

on:
  workflow_dispatch:
  # NOTE: Make sure the repository is a template before enabling this trigger.
  # push:
  #   branches:
  #     - main

permissions:
  contents: write
  actions: write
  issues: write

env:
  STEP_1_FILE: ".github/steps/1-context.md"

jobs:
  start_exercise:
    if: |
      !github.event.repository.is_template
    name: Start Exercise
    uses: skills/exercise-toolkit/.github/workflows/start-exercise.yml@v0.9.1
    with:
      exercise-title: "Build your daily triage assistant"
      intro-message: "Create a supervised daily triage workflow while keeping every repository change under human review."

  post_next_step_content:
    name: Post next step content
    runs-on: ubuntu-latest
    needs: [start_exercise]
    env:
      ISSUE_NUMBER: ${{ needs.start_exercise.outputs.issue-number }}
      ISSUE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main

      - name: Create labels and synthetic issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for spec in 'exercise:8250df' 'exercise-seed:bf8700' 'exercise-completion:1f883d' 'step-1:0969da' 'step-2:0969da' 'step-3:0969da' 'step-4:0969da' 'step-5:0969da' 'step-6:0969da' 'completed:1f883d' 'P1:b60205' 'P2:fbca04' 'P3:0e8a16' 'onboarding:5319e7' 'reliability:d4c5f9' 'documentation:0075ca' 'question:d876e3'; do
            gh label create "${spec%%:*}" --repo "$ISSUE_REPOSITORY" --color "${spec##*:}" --force >/dev/null
          done

          gh issue edit "$ISSUE_NUMBER" --repo "$ISSUE_REPOSITORY" --add-label exercise --add-label step-1 >/dev/null

          while IFS= read -r item; do
            title=$(jq -r .title <<<"$item")
            body=$(jq -r .body <<<"$item")
            found=$(gh issue list --repo "$ISSUE_REPOSITORY" --state all --search "\"$title\" in:title" --json title --jq ".[] | select(.title == \"$title\") | .title" | head -1)
            [[ -n "$found" ]] || gh issue create --repo "$ISSUE_REPOSITORY" --title "$title" --body "$body" --label exercise-seed >/dev/null
          done < <(jq -c '.[]' .github/exercise/seed-issues.json)

          complete=$(gh issue list --repo "$ISSUE_REPOSITORY" --state all --search '"Exercise complete: Daily triage assistant" in:title' --json title --jq '.[] | select(.title == "Exercise complete: Daily triage assistant") | .title' | head -1)
          [[ -n "$complete" ]] || gh issue create --repo "$ISSUE_REPOSITORY" --title 'Exercise complete: Daily triage assistant' --body 'Complete Step 5 to unlock the final activity.' --label exercise-completion >/dev/null

      - name: Create comment - add welcome and step content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh api --paginate "repos/$ISSUE_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" | jq -s '[add[] | select(.body | contains("<!-- step-1-context:start -->"))] | length')
          if [[ "$existing" == "0" ]]; then
            cat .github/steps/0-welcome.md "$STEP_1_FILE" > "$RUNNER_TEMP/step-1.md"
            gh issue comment "$ISSUE_NUMBER" --repo "$ISSUE_REPOSITORY" --body-file "$RUNNER_TEMP/step-1.md" >/dev/null
          fi

      - name: Create comment - watching for progress
        uses: ./.github/actions/post-feedback
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          step: 1
          message: "Watching for your marked Step 1 comment."

      - name: Enable next step workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable "Step 1"
