name: Find marked learner comment
description: Write the newest matching issue comment to a file
inputs:
  repository: {required: true}
  issue-number: {required: true}
  marker: {required: true}
  output-file: {required: true}
outputs:
  found: {value: "${{ steps.find.outputs.found }}"}
runs:
  using: composite
  steps:
    - id: find
      shell: bash
      env:
        GH_TOKEN: "${{ github.token }}"
        REPOSITORY: "${{ inputs.repository }}"
        ISSUE_NUMBER: "${{ inputs.issue-number }}"
        MARKER: "${{ inputs.marker }}"
        OUTPUT_FILE: "${{ inputs.output-file }}"
      run: |
        gh api --paginate "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" | jq -s --arg m "<!-- $MARKER:start -->" '[add[] | select(.body | contains($m))] | last | .body // empty' -r > "$OUTPUT_FILE"
        [[ -s "$OUTPUT_FILE" ]] && echo found=true >> "$GITHUB_OUTPUT" || echo found=false >> "$GITHUB_OUTPUT"
