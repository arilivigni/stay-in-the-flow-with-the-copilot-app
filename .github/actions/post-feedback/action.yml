name: Update stable exercise feedback
description: Create or replace one feedback comment
inputs:
  repository: {required: true}
  issue-number: {required: true}
  step: {required: true}
  message: {required: true}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: "${{ github.token }}"
        REPOSITORY: "${{ inputs.repository }}"
        ISSUE_NUMBER: "${{ inputs.issue-number }}"
        STEP: "${{ inputs.step }}"
        MESSAGE: "${{ inputs.message }}"
      run: |
        marker="<!-- exercise-feedback:$STEP -->"; body=$(printf '%s\n### Step %s feedback\n\n%s\n' "$marker" "$STEP" "$MESSAGE")
        id=$(gh api --paginate "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" | jq -s --arg m "$marker" '[add[] | select(.body | contains($m))] | first | .id // empty' -r)
        if [[ -n "$id" ]]; then gh api --method PATCH "repos/$REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null; else gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null; fi
